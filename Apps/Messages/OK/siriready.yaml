# SiriReady Bench reference app declaration (buildable "Relay", Phase 2).
# Declares intent that the source alone cannot express.
app_id: messages
domain: messages
display_name: "Relay (synthetic messages app)"

# Entities the developer intends to contribute to the Spotlight semantic index.
indexed_entities:
  - ContactEntity
  - ConversationEntity
  - MessageEntity

# Views the developer intends to carry View Annotations.
annotated_views:
  - ContactListView
  - ContactDetailView
  - ConversationListView
  - MessageDetailView

# Intended routing per intent.
privacy:
  SendMessageIntent: on_device_only
  DraftMessageIntent: on_device_only
  SetMessageReadStatusIntent: on_device_only
  OpenConversationIntent: on_device_only

# Main screens and the entity types they display.
screens:
  contact_list:
    view: ContactListView
    entities: [ContactEntity]
  contact_detail:
    view: ContactDetailView
    entities: [ContactEntity]
  conversation_list:
    view: ConversationListView
    entities: [ConversationEntity]
  message_detail:
    view: MessageDetailView
    entities: [MessageEntity]
